<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#b7a2e8"><title>VocabVibes</title><style>body{font-family:system-ui;background:#f8f5ff;color:#332b48;max-width:650px;margin:auto;padding:20px}h1{color:#7553b8}button,input,select,textarea{font:inherit;padding:12px;border-radius:12px;border:1px solid #d6c9eb;margin:5px 0}button{background:#c8b6f3;cursor:pointer}section{background:white;padding:16px;border-radius:18px;margin:15px 0;box-shadow:0 2px 12px #ddd5ed}input{max-width:90%}.card{min-height:100px;display:grid;place-items:center;background:#d9f5e9;border-radius:16px;font-size:1.5rem;padding:20px;cursor:pointer;text-align:center}small{color:#655c72}</style></head><body><h1>✨ VocabVibes</h1><p>Dein persönlicher Vokabeltrainer – ohne Anmeldung.</p><section><h2>Liste anlegen</h2><input id="listname" placeholder="Name der Liste"><button onclick="addList()">Liste erstellen</button><p><select id="lists" onchange="render()"></select></p><input id="en" placeholder="Englisch"><input id="de" placeholder="Deutsch"><button onclick="addWord()">Wort hinzufügen</button><p><small>Mehrere Wörter einfügen: je Zeile Englisch ; Deutsch</small></p><textarea id="bulk" rows="3" style="width:90%" placeholder="apple;Apfel&#10;house;Haus"></textarea><button onclick="bulkAdd()">Wörter übernehmen</button><p><label>📸 Foto auswählen <input type="file" accept="image/*" capture="environment" id="photo"></label></p><button onclick="scan()">Foto erkennen (Internet nötig)</button><p id="scanstatus"></p><div id="review"></div></section><section><h2>Üben</h2><select id="mode"><option value="cards">Karteikarten</option><option value="test">Schreibtest</option></select><button onclick="start()">Start</button><p id="progress"></p><div id="practice"></div></section><section><h2>Meine Wörter</h2><div id="words"></div><button onclick="exportData()">Sicherung herunterladen</button><input type="file" accept=".json" onchange="importData(event)"><p><small>Deine Daten bleiben auf diesem Gerät. Browserdaten löschen kann sie entfernen.</small></p></section><script>
let data=JSON.parse(localStorage.getItem('vocabvibes')||'{"lists":[]}'),current=null,flipped=false;
function save(){localStorage.setItem('vocabvibes',JSON.stringify(data));render()}
function selected(){return data.lists.find(x=>x.id===document.getElementById('lists').value)}
function addList(){let name=document.getElementById('listname').value.trim();if(!name)return;data.lists.push({id:String(Date.now()),name,words:[]});document.getElementById('listname').value='';save();document.getElementById('lists').value=data.lists.at(-1).id;render()}
function addWord(){let l=selected(),a=document.getElementById('en').value.trim(),b=document.getElementById('de').value.trim();if(!l||!a||!b)return;l.words.push({a,b,score:0});document.getElementById('en').value='';document.getElementById('de').value='';save()}
function bulkAdd(){let l=selected();if(!l)return;document.getElementById('bulk').value.split('\n').forEach(s=>{let [a,b]=s.split(';').map(x=>x?.trim());if(a&&b)l.words.push({a,b,score:0})});document.getElementById('bulk').value='';save()}
function render(){let el=document.getElementById('lists'),id=el.value;el.innerHTML=data.lists.map(l=>`<option value="${l.id}">${escapeHtml(l.name)}</option>`).join('');if(data.lists.some(l=>l.id===id))el.value=id;let l=selected();document.getElementById('words').innerHTML=l?l.words.map((w,i)=>`<p>${escapeHtml(w.a)} – ${escapeHtml(w.b)} (${w.score||0}/3) <button onclick="removeWord(${i})">✕</button></p>`).join(''):'Erstelle zuerst eine Liste.';document.getElementById('progress').textContent=l?`${l.words.filter(w=>w.score>=3).length} von ${l.words.length} Wörtern sicher gelernt`:''}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function removeWord(i){if(confirm('Wort löschen?')){selected().words.splice(i,1);save()}}
function start(){next()}
function next(){let l=selected();if(!l||!l.words.length){document.getElementById('practice').textContent='Füge zuerst Wörter hinzu.';return}let pool=l.words.filter(w=>w.score<3);if(!pool.length)pool=l.words;pool.sort((a,b)=>(a.score||0)-(b.score||0));current=pool[Math.floor(Math.random()*Math.min(3,pool.length))];flipped=false;show()}
function show(){let box=document.getElementById('practice');if(!current)return;if(document.getElementById('mode').value==='cards'){box.innerHTML=`<div class="card" onclick="flip()">${escapeHtml(flipped?current.b:current.a)}</div><p>${flipped?'':'Tippe zum Umdrehen'}</p>${flipped?'<button onclick="grade(false)">Noch üben</button><button onclick="grade(true)">Gewusst ✓</button>':''}`}else{box.innerHTML=`<div class="card">${escapeHtml(current.a)}</div><input id="answer" placeholder="Deutsche Übersetzung"><button onclick="check()">Prüfen</button><div id="feedback"></div>`}}
function flip(){flipped=true;show()}
function grade(ok){current.score=ok?Math.min(3,(current.score||0)+1):0;save();next()}
function check(){let answer=document.getElementById('answer').value.trim().toLocaleLowerCase('de');let ok=answer===current.b.trim().toLocaleLowerCase('de');document.getElementById('feedback').innerHTML=`<p>${ok?'Richtig!':'Richtige Antwort: '+escapeHtml(current.b)}</p><button onclick="grade(${ok})">Weiter</button>`}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.download='vocabvibes-sicherung.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){let f=e.target.files[0];if(!f)return;f.text().then(t=>{try{let x=JSON.parse(t);if(!Array.isArray(x.lists))throw Error();data=x;save()}catch{alert('Ungültige Sicherung')}})}
async function scan(){let file=document.getElementById('photo').files[0],status=document.getElementById('scanstatus');if(!file){status.textContent='Bitte zuerst ein Foto auswählen.';return}status.textContent='Texterkennung wird geladen …';try{if(!window.Tesseract){let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';document.head.append(s);await new Promise((res,rej)=>{s.onload=res;s.onerror=rej})}let r=await Tesseract.recognize(file,'eng+deu');let lines=r.data.text.split('\n').filter(x=>x.trim());document.getElementById('bulk').value=lines.map(x=>x.replace(/\s{2,}|\t|\s+[–—-]\s+/,';')).join('\n');status.textContent='Erkannte Zeilen im Textfeld prüfen und als Englisch ; Deutsch korrigieren, dann übernehmen.'}catch(e){status.textContent='Fotoerkennung nicht verfügbar. Bitte Wörter manuell eintragen.'}}
render();
</script></body></html>
